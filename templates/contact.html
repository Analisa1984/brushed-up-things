{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        
        <h1 class="mb-4">Contact Us</h1>
        <p class="text-muted">
            Have a question about our art collection? Drop us a message below.
        </p>
        
        <div class="card border-muted shadow-sm rounded-0 p-4 bg-white">
            <form method="POST" novalidate>
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-dark rounded-0 mt-3 w-100">
                    Send Message
                </button>
            </form>
        </div>
        
    </div>
</div>
{% endblock %}
