{% extends 'base.html' %}
{% load i18n %}
{% load static %}
{% load account %}

{% block content %}
  <div class="container">
    <div class="row my-5">
      <div class="col-md-6 mx-auto">
        <div class="card shadow">
        <div class="card-body">
        <h2>{% translate "Log in" %}</h2>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary">{% translate "Log in" %}</button>
        </form>
        <p class="mt-3 text-center small">
          {% translate "Don't have an account?" %} <a href="{% url 'account_signup' %}">{% translate "Sign up" %}</a>
        </p>
      </div>
      </div>
      </div>
    </div>
  </div>
{% endblock %}
