{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="{% url 'artwork_directory' %}" class="text-decoration-none">Inventory</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Edit Artwork</li>
                </ol>
            </nav>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    
                    <div class="text-center mb-4">
                        <h2 class="font-weight-bold h3 mb-2 text-dark">Edit Artwork</h2>
                        <p class="text-muted small">Updating: <span class="text-dark fw-bold">"{{ artwork.title }}"</span></p>
                        <hr class="w-25 mx-auto my-3">
                    </div>

                    <form method="POST" action="{% url 'edit_artwork' artwork.id %}" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        {{ form|crispy }}
                        
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end pt-4 mt-4 border-top">
                            <a href="{% url 'artwork_directory' %}" class="btn btn-outline-secondary px-4 me-md-2">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-dark px-4">
                                <i class="bi bi-save me-1"></i> Save Changes
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
