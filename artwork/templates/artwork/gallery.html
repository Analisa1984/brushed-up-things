{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">
    <div class="row">
        {% for artwork in artworks %}
            <div class="col-md-4 mb-4 d-flex align-items stretch">
                <div class="card h-100">
                    <img src="{{ artwork.image.url }}" class="card-img-top" alt="{{ artwork.title }}" style="height: 250px; object-fit: cover;">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <h5 class="card-title">{{ artwork.title }}</h5>
                        <p class="card-text">By: {{ artwork.artist }}</p>
                        <p class="card-text">{{ artwork.description|truncatechars:100 }}</p>
                        <p class="card-text">Medium: {{ artwork.medium }}</p>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-3 px-2 pb-2">
                        <p class="card-text mb-0"><strong>£{{ artwork.price|floatformat:2 }}</strong></p>
                        <a href="#" class="btn btn-outline-dark btn-sm">
                            <i class="bi bi-cart3 me-1"></i> Add to Shopping Cart    
                        </a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
