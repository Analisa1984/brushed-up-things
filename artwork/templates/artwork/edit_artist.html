{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %} {% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 p-4">
                <h2 class="text-center mb-2">Edit Artist Details</h2>
                <p class="text-muted text-center small">Update profile information for {{ artist.name }}</p>
                <hr class="w-25 mx-auto mb-4">

                <form method="POST" action="{% url 'edit_artist' artist.id %}" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    {{ form|crispy }}

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'artist_directory' %}" class="btn btn-outline-dark">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-dark">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
